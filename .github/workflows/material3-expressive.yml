name: Material 3 Expressive APK

# Builds the material3-expressive branch's prodRelease APK in CI, because the
# development VM cannot run Gradle (no SDK, and the sandbox proxy rejects
# services.gradle.org) — same reason as the Automix Pro workflow this is
# based on. Push to the material3-expressive branch (or run manually) to get
# a compiled, zipaligned APK plus its SHA-256.
#
# Base: upstream BitChord v1.9.1 stock (Automix stock, NO Automix Pro) with
# the whole design migrated to Material 3 Expressive on the ALPHA line
# (androidx material3 1.5.0-rc01 in app, JetBrains material3 1.11.0-alpha07
# in sharedUi) by order of Alejandro, 2026-11-09.
#
# Signing: this workflow does NOT sign. The author's keystore is not in this
# repo and must never be substituted. The APK comes out unsigned; sign it
# with the real keystore before distributing as an update, or install the
# unsigned artifact for testing only (Android rejects an unsigned APK as an
# update to the official install — it needs a clean install first).

on:
  push:
    branches: [material3-expressive]
  workflow_dispatch:

jobs:
  build-m3x:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup local.properties (Last.fm placeholders)
        # local.properties is optional (the build falls back to ""), but the
        # file must at least be well-formed. Empty keys = Last.fm disabled.
        run: |
          cat > local.properties <<'EOF'
          LASTFM_API_KEY=
          LASTFM_SECRET=
          EOF
          cat local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install NDK r28c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Shared module tests
        run: ./gradlew :shared:jvmTest

      - name: Build unsigned prodRelease APK
        # ABI splits are on (armeabi-v7a, arm64-v8a, x86_64 + universal), so
        # this produces one APK per ABI; the Galaxy A07 takes arm64-v8a.
        run: ./gradlew assembleProdRelease

      - name: Verify APKs (badging, alignment, signature state)
        run: |
          ls -lh app/build/outputs/apk/prod/release/
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          for APK in app/build/outputs/apk/prod/release/*.apk; do
            echo "--- $APK ---"
            "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity" | head -3
            "$BUILD_TOOLS/zipalign" -c -p 4 "$APK" && echo "zipalign: OK"
          done
          echo "--- apksigner verify (expected: unsigned) ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/prod/release/*.apk || true
          echo "--- SHA-256 (all APKs) ---"
          (cd app/build/outputs/apk/prod/release && sha256sum *.apk) | tee apk-sha256.txt

      - name: Upload APKs + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-m3x-unsigned
          path: |
            app/build/outputs/apk/prod/release/*.apk
            apk-sha256.txt

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m3x-test-reports
          path: shared/build/reports/tests/
