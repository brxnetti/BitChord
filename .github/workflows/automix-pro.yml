name: Automix Pro APK

# Builds the Automix Pro branch's prodRelease APK in CI, because the
# development VM cannot run the Gradle daemon reliably (OOM). Push to the
# automix-pro branch (or run manually) to get a compiled, zipaligned APK
# plus its SHA-256.
#
# Signing: this workflow does NOT sign. The author's keystore is not in this
# repo and must never be substituted. The APK comes out unsigned; sign it
# with the real keystore before distributing as an update, or install the
# debug-signed artifact for testing only.

on:
  push:
    branches: [automix-pro]
  workflow_dispatch:

jobs:
  build-automix-pro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup local.properties (Last.fm placeholders)
        run: |
echo "LASTFM_API_KEY=<redacted>
echo "LASTFM_SECRET=<redacted>

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Shared module tests (Automix Pro planner)
        run: ./gradlew :shared:jvmTest

      - name: Build unsigned prodRelease APK
        run: ./gradlew assembleProdRelease

      - name: Verify APK (badging, alignment, signature state)
        run: |
          APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
          echo "APK=$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          echo "--- aapt2 dump badging ---"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -E "package:|launchable-activity" | head -3
          echo "--- zipalign check ---"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$APK" && echo "zipalign: OK"
          echo "--- apksigner verify (expected: unsigned) ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" || true
          echo "--- SHA-256 ---"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK + SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-automix-pro-unsigned
          path: |
            app/build/outputs/apk/prod/release/*.apk
            apk-sha256.txt

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automix-pro-test-reports
          path: shared/build/reports/tests/
